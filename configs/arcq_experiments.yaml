schema_version: 1
checkpoint_path: results/arcq/paper_training_shared_actor_critic/arcq_best.pt
output_path: results/arcq/formal/raw_results.json

replication:
  episode_seed_start: 40260905
  episodes_per_topology: 10

environment:
  decision_interval: 4
  path_candidate_count: 3
  construction_kinds: []
  swap_tree_count: 3
  purification_kinds:
    - none

base_scenario:
  request_count: 80
  min_hops: 2
  max_hops: 4
  ttl: 24
  horizon: 100
  topology_nodes: 32
  topology_mode: random_regular
  random_regular_degree: 4
  endpoint_mode: distance_stratified
  arrival_batch_size: 4
  arrival_interval: 4
  demand_pairs: 1
  physical:
    generation_probability: 0.8
    swap_probability: 0.9
    memory_capacity: 2
    node_memory_capacity: 4
    max_width: 1
    memory_lifetime: 100
    initial_fidelity: 0.99
    swap_degradation: 0.95
    quantum_distance_m: 1000.0
    detector_efficiency: 1.0
    bsm_success_probability: 1.0
    slot_duration_ps: 100000000

baselines:
  - name: Greedy
    algorithm: greedy
    path_candidate_count: 1
    construction_kind: balanced
  - name: Path-only
    algorithm: qpass
    path_candidate_count: 3
    construction_kind: balanced
  - name: Construction-only
    algorithm: construction_only
    path_candidate_count: 1
    construction_kind: balanced
    swap_tree_count: 3
  - name: Q-LEAP
    algorithm: qleap
    path_candidate_count: 3
    construction_kind: balanced
  - name: Q-CAST
    algorithm: qcast
    path_candidate_count: 3
    construction_kind: left_deep

suites:
  - id: offered_load
    x_label: requests_per_decision
    points:
      - id: load_2
        value: 2
        topology_seeds: [5101, 5102, 5103]
        scenario: {request_count: 40, arrival_batch_size: 2}
      - id: load_3
        value: 3
        topology_seeds: [5101, 5102, 5103]
        scenario: {request_count: 60, arrival_batch_size: 3}
      - id: load_4
        value: 4
        topology_seeds: [5101, 5102, 5103]
        scenario: {request_count: 80, arrival_batch_size: 4}
      - id: load_5
        value: 5
        topology_seeds: [5101, 5102, 5103]
        scenario: {request_count: 100, arrival_batch_size: 5}
      - id: load_6
        value: 6
        topology_seeds: [5101, 5102, 5103]
        scenario: {request_count: 120, arrival_batch_size: 6}

  - id: network_scale
    x_label: nodes
    points:
      - id: nodes_16
        value: 16
        topology_seeds: [5201, 5202, 5203]
        scenario: {topology_nodes: 16, request_count: 40, arrival_batch_size: 2}
