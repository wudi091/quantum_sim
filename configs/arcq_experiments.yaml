        scenario: {topology_nodes: 32, request_count: 80, arrival_batch_size: 4}
      - id: nodes_48
        value: 48
        topology_seeds: [5201, 5202, 5203]
        scenario: {topology_nodes: 48, request_count: 120, arrival_batch_size: 6}
      - id: nodes_64
