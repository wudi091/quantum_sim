        scenario: {topology_nodes: 64, request_count: 160, arrival_batch_size: 8}

  - id: memory_capacity
    x_label: memory_units_per_node
    points:
      - id: memory_2
        value: 2
        topology_seeds: [5301, 5302, 5303]
        scenario: {physical: {node_memory_capacity: 2}}
